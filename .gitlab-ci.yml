stages:
  - validate
  - build
  - windows

variables:
  FLUTTER_VERSION: "3.47.0"
  FVM_VERSION: "4.3.0"
  PUB_CACHE: "$CI_PROJECT_DIR/.cache/pub"
  FVM_CACHE_PATH: "$CI_PROJECT_DIR/.cache/fvm"

default:
  interruptible: true

.linux-flutter:
  image: ghcr.io/cirruslabs/flutter:3.44.0@sha256:46691e311715845de03a3ba4753a475476936805b29431b1f00f1816981033f8
  before_script:
    - export PATH="$PUB_CACHE/bin:$PATH"
    - command -v node >/dev/null || (apt-get update -qq && apt-get install -y -qq nodejs)
    - dart pub global activate fvm "$FVM_VERSION"
    - (cd flutter_workspace && fvm install "$FLUTTER_VERSION" && flutter_version_output=$(fvm flutter --version) && printf '%s\n' "$flutter_version_output" | grep -F "Flutter $FLUTTER_VERSION ")
    - node --version
  cache:
    key: flutter-3-47-linux
    paths:
      - .cache/pub/
      - .cache/fvm/

migration-ledger:
  extends: .linux-flutter
  stage: validate
  script:
    - node --test tests/flutterMigrationInventory.test.js tests/flutterWorkspaceStructure.test.js tests/flutterCiChecks.test.js
    - node tools/flutter_migration_inventory/validate_ledgers.js
    - node tools/flutter_migration_inventory/source_inventory.js
    - node tools/flutter_migration_inventory/generate_report.js
    - git diff --exit-code -- migration/flutter/generated/source-inventory.json migration/flutter/generated/coverage.md

flutter-test:
  extends: .linux-flutter
  stage: validate
  script:
    - cd flutter_workspace
    - fvm dart pub get --enforce-lockfile
    - node --test tool/verify_boundaries.test.js
    - node tool/verify_boundaries.js .
    - fvm dart format --output=none --set-exit-if-changed .
    - fvm dart analyze
    - fvm flutter test packages/* apps/*

flutter-web-android:
  extends: .linux-flutter
  stage: build
  needs:
    - migration-ledger
    - flutter-test
  script:
    - cd flutter_workspace
    - fvm dart pub get --enforce-lockfile
    - cd apps/web_app
    - fvm flutter build web --release
    - cd ../android_app
    - fvm flutter build apk --release
  artifacts:
    expire_in: 7 days
    paths:
      - flutter_workspace/apps/web_app/build/web/
      - flutter_workspace/apps/android_app/build/app/outputs/flutter-apk/app-release.apk

flutter-windows:
  stage: windows
  tags:
    - windows
  before_script:
    - $env:PATH = "$env:PUB_CACHE\bin;$env:PATH"
    - dart pub global activate fvm $env:FVM_VERSION
    - Push-Location (Join-Path $env:CI_PROJECT_DIR 'flutter_workspace'); try { & fvm install $env:FLUTTER_VERSION; if ($LASTEXITCODE -ne 0) { throw "FVM install failed with code $LASTEXITCODE" }; $FlutterVersionOutput = @(& fvm flutter --version); if ($LASTEXITCODE -ne 0) { throw "FVM version failed with code $LASTEXITCODE" }; if ($FlutterVersionOutput.Count -eq 0 -or -not $FlutterVersionOutput[0].StartsWith("Flutter $env:FLUTTER_VERSION ")) { throw "Unexpected Flutter SDK version" } } finally { Pop-Location }
    - node --version
  script:
    - '& "$env:CI_PROJECT_DIR\flutter_workspace\tool\check.ps1"'
  cache:
    key: flutter-3-47-windows
    paths:
      - .cache/pub/
      - .cache/fvm/
  artifacts:
    expire_in: 7 days
    paths:
      - flutter_workspace/apps/windows_app/build/windows/x64/runner/Release/
