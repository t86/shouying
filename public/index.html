<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
 
    <!-- 预加载关键资源 -->
    <link rel="preload" href="/shouyin/js/runtime.js" as="script">
    <link rel="preload" href="/shouyin/js/framework.js" as="script">
    <link rel="preload" href="/shouyin/js/initial.js" as="script">
    <link rel="preload" href="/shouyin/css/initial.css" as="stylesheet">
    
    <!-- 内联关键 CSS -->
    <style>
      .skeleton-initial {
        width: 100vw;
        height: 100vh;
        background-color: #080b16;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
      }
      
      .skeleton-login {
        width: 100%;
        max-width: 400px;
        margin: 100px auto;
        padding: 20px;
      }
      
      .skeleton-header {
        height: 40px;
        background: linear-gradient(90deg, #1a1d2d 25%, #252837 37%, #1a1d2d 63%);
        background-size: 400% 100%;
        margin-bottom: 20px;
        animation: skeleton-loading 1.4s ease infinite;
      }
      
      .skeleton-input {
        height: 40px;
        background: linear-gradient(90deg, #1a1d2d 25%, #252837 37%, #1a1d2d 63%);
        background-size: 400% 100%;
        margin-bottom: 16px;
        animation: skeleton-loading 1.4s ease infinite;
      }
      
      .skeleton-button {
        height: 40px;
        background: linear-gradient(90deg, #1a1d2d 25%, #252837 37%, #1a1d2d 63%);
        background-size: 400% 100%;
        animation: skeleton-loading 1.4s ease infinite;
      }
      
      @keyframes skeleton-loading {
        0% { background-position: 100% 50%; }
        100% { background-position: 0 50%; }
      }
    </style>
    
    <meta http-equiv="pragram" content="no-cache">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Cache" content="no-cache">
    <meta http-equiv="expires" content="0">

    <!-- <link rel="stylesheet" href="/css/print.css" media="print"> -->
    <!-- <link href="/path/print.css" media="print" rel="stylesheet" /> -->
    <title><%= htmlWebpackPlugin.options.title %></title>
     <!-- 延迟加载非关键资源 -->
     <link rel="prefetch" href="/shouyin/js/vendors.js">
  
    <script type="text/javascript" src="https://api.map.baidu.com/api?type=webgl&v=3.0&ak=BhteLO6flMZteTIkxiSwTB9lvEMAR9YU" async></script>
     
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <!-- 初始骨架屏 -->
      <div class="skeleton-initial" style="display: block">
        <div class="skeleton-login">
          <div class="skeleton-header"></div>
          <div class="skeleton-input"></div>
          <div class="skeleton-input"></div>
          <div class="skeleton-button"></div>
        </div>
      </div>
    </div>
    <script>
      // 在 Vue 初始化完成后隐藏初始骨架屏
      window.addEventListener('load', function() {
        setTimeout(function() {
          console.log('加载完毕');
          var initialSkeleton = document.querySelector('.skeleton-initial');
          if (initialSkeleton) {
            initialSkeleton.style.display = 'none';
          }
        }, 0);
      });
    </script>
    <!-- built files will be auto injected -->
  </body>
</html>
