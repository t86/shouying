publish_to: none
version: 0.0.1
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  design_system:
    path: ../design_system
  foundation:
    path: ../foundation
  permissions:
    path: ../permissions
  protocol:
    path: ../protocol
  realtime_sync:
    path: ../realtime_sync
  session:
    path: ../session
  qr: ^3.0.2
  path_provider: ^2.1.6
  web: ^1.1.1
